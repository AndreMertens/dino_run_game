name: dino_run_game
description: A 2D infinite side scroller.
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.0.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flame: 1.22.0
  provider: ^6.1.2
  hive: 2.2.3
  path_provider: ^2.1.5
  flame_audio: ^2.0.0
  window_manager: ^0.4.2
  flame_riverpod: ^5.0.0
  flutter_riverpod: ^2.6.1

dev_dependencies:
  hive_generator: 2.0.1
  build_runner: ^2.4.13
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  win32: ^5.5.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/parallax/
    - assets/images/AngryPig/
    - assets/images/Bat/
    - assets/images/Rino/
    - assets/audio/
    - assets/images/Rock/
    - assets/images/BlueBird/
